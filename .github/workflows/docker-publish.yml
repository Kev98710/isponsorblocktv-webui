name: Build, test and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild on top of the latest iSponsorBlockTV image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_IMAGE: ghcr.io/dmunozv04/isponsorblocktv

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/isponsorblocktv-webui" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pin the base image to one digest so the tested and the published image use the same base
      - name: Resolve iSponsorBlockTV base image
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest" && test "$digest" != "null"
          echo "base=$UPSTREAM_IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "Base image: $UPSTREAM_IMAGE@$digest"

          # Name the version only if the latest release tag points to the same image
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/dmunozv04/iSponsorBlockTV/releases/latest | jq -r '.tag_name // empty')
          version=""
          for candidate in "$tag" "${tag#v}"; do
            [ -n "$candidate" ] || continue
            d=$(docker buildx imagetools inspect "$UPSTREAM_IMAGE:$candidate" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true)
            if [ "$d" = "$digest" ]; then version="${tag#v}"; break; fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "iSponsorBlockTV version: ${version:-unknown (latest release tag does not match :latest)}"

      # 1) Build for the runner and run smoke tests before anything is published
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: ISBTV_IMAGE=${{ steps.upstream.outputs.base }}
          platforms: linux/amd64
          tags: webui:test

      - name: Smoke test
        run: |
          set -e
          # The pairing / search functions of iSponsorBlockTV must still exist
          docker run --rm --entrypoint python3 webui:test -c "
          import sys; sys.path.insert(0, '/app')
          from iSponsorBlockTV import api_helpers, constants
          assert hasattr(api_helpers.ApiHelper, 'pair_with_code'), 'pair_with_code missing'
          assert hasattr(api_helpers.ApiHelper, 'search_channels'), 'search_channels missing'
          assert len(constants.skip_categories) > 0
          print('upstream API OK')"
          # The web interface must start and answer
          docker run -d --name webui-test -p 8080:8080 webui:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/api/meta | jq -e '.categories | length > 0'
          curl -fs http://127.0.0.1:8080/api/status | jq -e '.state == "not_configured"'
          curl -fs http://127.0.0.1:8080/ | grep -q 'iSponsorBlockTV'
          # Changing requests without the CSRF header are rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/process/restart)" = 403
          docker logs webui-test
          docker rm -f webui-test
          # With a password, the API requires a login
          docker run -d --name webui-auth -p 8081:8080 -e WEBUI_PASSWORD=smoke-test webui:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8081/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/status)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Requested-With: webui' \
            -H 'Content-Type: application/json' -d '{"password":"wrong"}' http://127.0.0.1:8081/api/login)" = 401
          curl -fs -c /tmp/jar -X POST -H 'X-Requested-With: webui' -H 'Content-Type: application/json' \
            -d '{"password":"smoke-test"}' http://127.0.0.1:8081/api/login >/dev/null
          curl -fs -b /tmp/jar http://127.0.0.1:8081/api/status | jq -e '.state == "not_configured"'
          docker rm -f webui-auth

      # 2) Publish multi-arch image (not for pull requests)
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=isbtv-${{ steps.upstream.outputs.version }},enable=${{ steps.upstream.outputs.version != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ISBTV_IMAGE=${{ steps.upstream.outputs.base }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
